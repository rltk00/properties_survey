    const sp = p.matrixTransform(svg.getScreenCTM().inverse()), i = Math.max(0, Math.min(TREND_MONTHS - 1, Math.floor((sp.x - L) / cw))), m = months[i];
    xh.setAttribute('x1', xc(i)); xh.setAttribute('x2', xc(i)); xh.setAttribute('visibility', 'visible');
    const row = (name, mm, c) => `<div><i style="background:${c}"></i>${name} ${mm.has(m) ? `${fmtMan(Math.round(median(mm.get(m)) / 100) * 100)} <span class="label-hint">(${mm.get(m).length}건)</span>` : '<span class="label-hint">거래 없음</span>'}</div>`;
    tip.innerHTML = `<b>${m.replace('-', '.')}</b>${row('매매', sM, C_SALE)}${row('전세', jM, C_JEONSE)}`;
    tip.hidden = false;
    const wrap = box.querySelector('.chart-wrap').getBoundingClientRect(), px = (xc(i) / W) * wrap.width;
    tip.style.left = `${Math.min(wrap.width - tip.offsetWidth - 4, Math.max(4, px + 10))}px`;
  });
  svg.querySelector('.hit').addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}

/* ───────── 매물 보기: 네이버 부동산 매물 목록을 팝업 창으로 (같은 창 재사용) ─────────
   네이버 지도 URL의 layer 값은 화면 상태 JSON을 lz-string으로 압축한 것.
   [{"id":"article_list","searchParams":{"type":"CLUSTER","clusterId":"17/x/y"}}] → 건물이 속한 줌17 타일의 매물 목록 */
function naverListingUrl(b) {
  const z = 17, n = 2 ** z, r = b.lat * Math.PI / 180;
  const x = Math.floor((b.lng + 180) / 360 * n);
  const y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  const layer = LZString.compressToEncodedURIComponent(JSON.stringify([{ id: 'article_list', searchParams: { type: 'CLUSTER', clusterId: `${z}/${x}/${y}` } }]));
  // center = base62(경도×10⁷ + 2×10⁹) + '-' + base62(위도×10⁷ + 2×10⁹)  (알파벳 0-9a-zA-Z)
  // 예: 서울시청 126.9786445, 37.5666612 → 3zhGP3-2AM3pq
  const B62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const enc = v => { let n = Math.round(v * 1e7) + 2e9, s = ''; while (n > 0) { s = B62[n % 62] + s; n = Math.floor(n / 62); } return s; };
  return `https://fin.land.naver.com/map?center=${enc(b.lng)}-${enc(b.lat)}&zoom=${z}&tradeTypes=A1-B1-B2&realEstateTypes=A01-A04-B01-A05-A06-A07-C02&layer=${layer}`;
}
function openListings(b) {
  const url = window.LZString && b.lat != null ? naverListingUrl(b)
    : `https://fin.land.naver.com/search?query=${encodeURIComponent(`${b.umd} ${b.name}`)}`;
  const w = Math.min(1280, screen.availWidth - 80), h = Math.min(900, screen.availHeight - 80);
  const win = window.open(url, 'naverLand', `width=${w},height=${h},left=${(screen.availWidth - w) / 2},top=${(screen.availHeight - h) / 2}`);
  if (win) win.focus(); else window.open(url, '_blank');   // 팝업이 막히면 새 탭
}

/* ───────── 즐겨찾기 ───────── */
function toggleFav(b) {
  if (isFav(b.id)) favs = favs.filter(f => f.id !== b.id);
  else favs.unshift({ id: b.id, name: b.name, kind: b.kind, sgg: b.sgg, umd: b.umd, jibun: b.jibun, dong: S.dong?.code,
                      address: `${sggFull(b.sgg)} ${b.umd} ${b.jibun}`.trim(), lat: b.lat, lng: b.lng });
  saveFavs(); drawFavs();
  const on = isFav(b.id), btn = $('#favBtn');
  if (btn) { btn.icon = on ? 'star-f' : 'star'; btn.text = on ? '즐겨찾기 해제' : '즐겨찾기 추가'; btn.classList.toggle('fav-mark', on); }
  renderFavs(); render();
}
function renderFavs() {
  $('#favs').innerHTML = favs.length ? favs.map((f, i) => {
    const b = S.buildings.get(f.id), latest = b?.deals.find(d => d.trade === prefs.trade);
    const dist = distances(f).filter(x => x.d != null).map(x => `${esc(x.name)} ${km(x.d)}`).join(' · ');
    return `<div class="card" data-i="${i}">
      <div class="card-title"><span class="badge ${f.kind}">${KIND_KO[f.kind]}</span>${esc(f.name)}</div>
      ${latest ? `<div class="card-price">${TRADE_KO[prefs.trade]} ${priceFull(latest)} <span class="card-meta">${latest.ymd}</span></div>` : ''}
      <div class="card-meta">${esc(f.address)}</div>
      ${dist ? `<div class="card-meta">${dist}</div>` : ''}
      <div class="card-actions"><calcite-action icon="trash" text="즐겨찾기 해제" scale="s" data-act="del"></calcite-action></div>
    </div>`; }).join('')
    : '<div class="empty-state"><calcite-icon icon="star" scale="l"></calcite-icon>상세 정보의 별표를 누르면<br>여기에 추가됩니다.</div>';
}
async function openFav(f) {
  if (!f.dong) return status('이 즐겨찾기는 동 정보가 없어 열 수 없습니다.', true);
  if (S.dong?.code !== f.dong) await selectDong(f.dong);
  const b = S.buildings.get(f.id);
  if (b && b.lat != null) select(b, true);
  else status(`${f.name}의 실거래가 현재 기간에 없습니다.`, true);
}

function closeDetail() {
  clearRoute();
  const end = $('#end-panel');
  if (!end.collapsed) { end.collapsed = true; relayout(); }
  if (!$('#sheet').hidden) { $('#sheet').hidden = true; $('.mapwrap').classList.remove('sheet-open'); relayout(); }
  if (S.sel) { S.sel = null; render(); }
}

let shownStops = [];
async function loadStops(b) {
  const box = () => document.querySelector(`#stops[data-for="${CSS.escape(b.id)}"]`);
  try {
    const stops = await nearestStops(b);
    if (!box()) return;
    shownStops = stops;
    box().innerHTML = stops.length
      ? stops.map((s, i) => `<div class="stop" data-i="${i}">
          <div class="stop-head" role="button" tabindex="0"><calcite-icon icon="chevron-right" scale="s"></calcite-icon>
            <span class="grow">${esc(s.name)} <span class="label-hint">${s.no ? esc(s.no) : ''}</span></span><span class="num">${km(s.dist)}</span></div>
          <div class="routes" hidden></div></div>`).join('')
      : '<span class="label-hint">주변 정류장이 조회되지 않았습니다.</span>';
    bindStops();
  } catch (e) {
    if (box()) box().innerHTML = `<span class="msg-error">${esc(e.message)}</span>`;
  }
}
function bindStops() {
  document.querySelectorAll('#stops .stop').forEach(el => {
    const s = shownStops[+el.dataset.i], box = el.querySelector('.routes');
    el.querySelector('.stop-head').onclick = async () => {         // 정류장: 펼치기 / 접기
      const open = !el.classList.contains('is-open');
      el.classList.toggle('is-open', open);
      box.hidden = !open;
      el.querySelector('.route-info')?.toggleAttribute('hidden', !open);
      if (!open || box.dataset.loaded) return;
      box.innerHTML = '<span class="label-hint">노선 조회 중…</span>';
      try {
        const rs = s.routes = await stopRoutes(s);
        box.dataset.loaded = 1;
        box.innerHTML = rs.length ? rs.map((x, i) => `<button type="button" class="route" data-r="${i}" title="${esc(x.type)} · ${esc(x.dest)} 방면">${esc(x.name)}</button>`).join('') : '<span class="label-hint">노선 없음</span>';
      } catch (err) { box.innerHTML = `<span class="msg-error">${esc(err.message)}</span>`; }
    };
    box.onclick = async e => {                                       // 노선: 경로 표시 / 다시 누르면 취소
      const chip = e.target.closest('.route'); if (!chip) return;
      try { await showRoute(s.routes[+chip.dataset.r], chip); }
      catch (err) { clearRoute(); box.insertAdjacentHTML('afterend', `<div class="route-info msg-error">${esc(err.message)}</div>`); }
    };
  });
}
const ROUTE_COLORS = ['#d6336c', '#7048e8', '#0c8599', '#e67700', '#2b8a3e'];
let routeLayer = [], shownRoute = null;
function clearRoute() {
  routeLayer.forEach(o => o.setMap(null)); routeLayer = []; shownRoute = null;
  document.querySelectorAll('.route.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.route-info').forEach(x => x.remove());
}
async function showRoute(r, chip) {
  const key = `${r.src}${r.id}`;
  if (shownRoute === key) { clearRoute(); return; }
  clearRoute();
  shownRoute = key;
  const color = ROUTE_COLORS[[...r.id].reduce((a, c) => a + c.charCodeAt(0), 0) % ROUTE_COLORS.length];
  chip.classList.add('on'); chip.style.setProperty('--route', color);
  const p = await routePath(r);
  if (shownRoute !== key) return;
  if (p.line.length < 2) throw new ApiError('노선 경로 정보가 없습니다.');
  const path = p.line.map(([la, ln]) => new kakao.maps.LatLng(la, ln));
  routeLayer.push(new kakao.maps.Polyline({ map, path, strokeWeight: 5, strokeColor: color, strokeOpacity: 0.85, zIndex: 3 }));
  for (const s of p.stops) {
    const el = document.createElement('span');
    el.className = 'stopdot'; el.title = s.name; el.style.setProperty('--route', color);
    routeLayer.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(s.lat, s.lng), content: el, zIndex: 4 }));
  }
  chip.parentElement.insertAdjacentHTML('afterend', `<div class="route-info"><b>${esc(r.name)}</b> ${esc(r.type)} · ${esc(r.dest)} 방면 · 정류장 ${p.stops.length}개</div>`);
}

/* ───────── 시작 ───────── */
function showKeyState() {
  const k = keys();
  $('#kData').value = k.data; $('#kKakao').value = k.kakao; $('#kVworld').value = k.vworld;
  if (!(k.data && k.kakao && k.vworld)) openPanel('settings');
}
const MOBILE_MQ = matchMedia('(max-width: 768px)');
const isMobile = () => MOBILE_MQ.matches;
function applyLayout() {              // 모바일은 패널을 지도 위에 겹쳐 열고(overlay), 데스크톱은 나란히(dock)
  $('#start-panel').displayMode = isMobile() ? 'overlay' : 'dock';
  // 상세 패널: 데스크톱은 오른쪽 패널, 모바일은 지도 아래쪽 시트로 옮김
  const detail = $('#detail'), wasOpen = S.sel != null;
  if (isMobile() && detail.parentElement !== $('#sheet')) { $('#sheet').append(detail); $('#end-panel').collapsed = true; }
  if (!isMobile() && detail.parentElement !== $('#end-panel')) { $('#end-panel').append(detail); $('#sheet').hidden = true; $('.mapwrap').classList.remove('sheet-open'); }
  if (wasOpen) { const b = S.buildings.get(S.sel); if (b) showDetail(b); }
  if (isMobile()) $('#start-panel').collapsed = true;
  relayout();
}
function openPanel(id) {
  if (isMobile() && !$('#end-panel').collapsed) closeDetail();
  const start = $('#start-panel'), act = document.querySelector(`#nav calcite-action[data-panel="${id}"]`);
  if (act.active && !start.collapsed) { start.collapsed = true; relayout(); return; }
  document.querySelectorAll('#nav calcite-action').forEach(a => a.active = a === act);
  document.querySelectorAll('#start-panel calcite-panel').forEach(p => p.hidden = p.dataset.panelId !== id);
  if (id === 'favorites') renderFavs();
  if (start.collapsed) { start.collapsed = false; relayout(); }
}
const setSeg = (id, v) => $(id).querySelectorAll('calcite-segmented-control-item').forEach(i => { const on = i.getAttribute('value') === v; i.toggleAttribute('checked', on); i.checked = on; });
const onSeg = (id, fn) => $(id).addEventListener('calciteSegmentedControlChange', e => fn(e.target.value));

async function initMap() {
  if (map) return;
  try { await loadKakao(); } catch (e) { $('#mapMsg').textContent = e.message; return; }
  $('#mapMsg').hidden = true;
  // 초기 화면: 마지막으로 보던 위치 → 없으면 내 위치 → 그것도 안 되면 기본 위치
  const [lat, lng, level] = prefs.view || [37.27, 127.1, 7];
  map = new kakao.maps.Map($('#map'), { center: new kakao.maps.LatLng(lat, lng), level });
  // 첫 화면: 마지막으로 보던 지도 위치 (동 선택은 복원하지 않음, 내 위치는 버튼으로만)
  const LABEL_MAX_LEVEL = 6;   // 이보다 축소하면 마커(아이콘·이름)를 숨김
  const syncLabels = () => $('#map').classList.toggle('labels-off', map.getLevel() > LABEL_MAX_LEVEL);
  kakao.maps.event.addListener(map, 'zoom_changed', syncLabels); syncLabels();
  $('#myLocBtn').addEventListener('click', () => locateMe());
  $('#zoomIn').addEventListener('click', () => map.setLevel(map.getLevel() - 1, { animate: true }));
  $('#zoomOut').addEventListener('click', () => map.setLevel(map.getLevel() + 1, { animate: true }));
  $('#schoolBtn').addEventListener('click', () => toggleSchool(!prefs.school));
  if (prefs.school) toggleSchool(true);
  kakao.maps.event.addListener(map, 'idle', () => { if (map.getLevel() >= CLUSTER_LEVEL || overlays.length) drawPins(); clearTimeout(idleTimer); idleTimer = setTimeout(onIdle, 300); });
  kakao.maps.event.addListener(map, 'mousemove', e => onMouseMove(e.latLng));
  kakao.maps.event.addListener(map, 'click', e => onMapClick(e.latLng));
  $('#map').addEventListener('mouseleave', clearHover);
  // 마우스로 마커 위에 있을 때만 동 hover를 끔. 터치에서는 hover 개념이 없으므로, 마커를 탭한 직후의 지도 클릭만 무시
  const MARKER_SEL = '.cluster, .pin, .mk';
  $('#map').addEventListener('pointerover', e => { if (e.pointerType === 'mouse' && e.target.closest(MARKER_SEL)) { overMarker = true; clearHover(); } });
  $('#map').addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest(MARKER_SEL) && !e.relatedTarget?.closest?.(MARKER_SEL)) overMarker = false; });
  $('#map').addEventListener('pointerdown', e => { if (e.target.closest(MARKER_SEL)) markerTapAt = Date.now(); else if (e.pointerType !== 'mouse') overMarker = false; }, true);
  ensureLandmarks().catch(() => {});
  drawFavs();
}

(async function boot() {
  await Promise.all(['calcite-segmented-control', 'calcite-panel', 'calcite-shell-panel', 'calcite-input-number', 'calcite-slider', 'calcite-dropdown', 'calcite-button', 'calcite-pagination'].map(t => customElements.whenDefined(t)));

  // 저장된 설정 복원
  setSeg('#kind', prefs.kind); setSeg('#trade', prefs.trade); setSeg('#unit', prefs.unit);
  $('#amin').value = prefs.amin; $('#amax').value = prefs.amax;
  $('#months').value = prefs.months; fillSort();

  onSeg('#kind', v => { prefs.kind = v; savePrefs(); updateHint(); render(); });
  onSeg('#trade', v => { prefs.trade = v; savePrefs(); syncPriceUI(); updateHint(); render(); const b = S.buildings.get(S.sel); if (b) showDetail(b); });
  syncPriceUI();
  $('#price').labelFormatter = (v, type) => type === 'tick' ? (v >= PRICE_MAX ? '30+' : String(v / 10000)) : undefined;   // 눈금 단위: 억
  $('#price').addEventListener('calciteSliderInput', e => { prefs.pmin = e.target.minValue; prefs.pmax = e.target.maxValue; savePrefs(); syncPriceUI(); updateHint(); render(); });
  syncAgeUI();
  const onAge = () => { savePrefs(); syncAgeUI(); updateHint(); render(); };
  $('#age').addEventListener('calciteSliderInput', e => { prefs.ageMin = e.target.minValue; prefs.ageMax = e.target.maxValue; onAge(); });
  for (const end of ['from', 'to']) $(end === 'from' ? '#ageFrom' : '#ageTo').addEventListener('click', e => {
    const it = e.target.closest('calcite-dropdown-item'); if (!it) return;
    pickAgeEnd(end, it.dataset.bin); onAge();
  });
  onSeg('#unit', v => {
    if (v === prefs.unit) return;
    for (const k of ['amin', 'amax']) { const x = parseFloat(prefs[k]); if (!isNaN(x)) prefs[k] = $('#' + k).value = (v === 'py' ? x / PY : x * PY).toFixed(1); }
    prefs.unit = v; savePrefs(); updateHint();
  });
  for (const k of ['amin', 'amax']) $('#' + k).addEventListener('calciteInputNumberInput', e => { prefs[k] = e.target.value; savePrefs(); updateHint(); render(); });
  $('#months').onchange = () => { prefs.months = $('#months').value; savePrefs(); updateHint(); if (S.dong) selectDong(S.dong.code, { fit: false }); };
  $('#sort').onchange = () => { prefs.sort = $('#sort').value; savePrefs(); render(); };

  // 패널 · 지역 선택
  document.querySelectorAll('#nav calcite-action').forEach(a => a.addEventListener('click', () => openPanel(a.dataset.panel)));
  $('#detail').addEventListener('calcitePanelClose', closeDetail);
  fillSido();
  $('#sido').onchange = () => { const v = $('#sido').value; fillSgg(v); if (v) moveTo(SIDO_NAME[v], 10); };
  $('#sgg').onchange = async () => {
    const v = $('#sgg').value; if (!v) return;
    await fillDong(v);
    const ds = [...S.dongs.values()].filter(d => d.sgg === v);
    if (ds.length && map) { const b = new kakao.maps.LatLngBounds(); ds.forEach(d => d.parts.flat().forEach(([la, ln]) => b.extend(new kakao.maps.LatLng(la, ln)))); map.setBounds(b); }
  };
  $('#dong').onchange = () => { if ($('#dong').value) selectDong($('#dong').value); };

  $('#saveKeys').addEventListener('click', () => {
    store.set('keys', { data: $('#kData').value.trim(), kakao: $('#kKakao').value.trim(), vworld: $('#kVworld').value.trim() });
    places.forEach(p => { p.failed = false; }); status('키를 저장했습니다.');
    if (!map) initMap();
    openPanel('search');
  });
  // 내 장소
  $('#places').addEventListener('click', e => {
    const act = e.target.closest('calcite-action'), row = e.target.closest('.place'); if (!act || !row) return;
    const p = places.find(x => x.id === row.dataset.id); if (!p) return;
    if (act.dataset.act === 'del') {
      if (!confirm(`'${p.name}'을(를) 내 장소에서 삭제할까요?`)) return;
      places = places.filter(x => x !== p);
      if (editingPlace === p.id) resetPlaceForm();
      placesChanged();
    } else {
      editingPlace = p.id;
      $('#pName').value = p.name; $('#pAddr').value = p.address; $('#pMsg').textContent = '';
      $('#pSave').textContent = '수정 저장'; $('#pSave').iconStart = 'save'; $('#pCancel').hidden = false;
      renderPlaces();
    }
  });
  $('#pSave').addEventListener('click', savePlaceForm);
  $('#pCancel').addEventListener('click', resetPlaceForm);
  $('#pAddr').addEventListener('keydown', e => { if (e.key === 'Enter') savePlaceForm(); });

  // 즐겨찾기
  $('#favs').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const f = favs[+card.dataset.i];
    if (e.target.closest('calcite-action[data-act="del"]')) {
      favs = favs.filter(x => x !== f); saveFavs(); renderFavs(); drawFavs(); render();
      const b = S.buildings.get(S.sel); if (b?.id === f.id) showDetail(b);
      return;
    }
    openFav(f);
  });

  renderPlaces(); renderFavs();
  // 아래쪽 시트 높이: 손잡이를 끌어 조절 (지도 높이 대비 비율로 저장)
  const wrap = $('.mapwrap'), setSheetH = f => { prefs.sheetH = Math.min(0.9, Math.max(0.2, f)); wrap.style.setProperty('--sheet-h', `${(prefs.sheetH * 100).toFixed(1)}%`); };
  setSheetH(prefs.sheetH || 0.45);
  $('#sheetHandle').addEventListener('pointerdown', e => {
    e.preventDefault();
    const h = $('#sheetHandle'); h.setPointerCapture(e.pointerId);
    const move = ev => { const r = wrap.getBoundingClientRect(); setSheetH((r.bottom - ev.clientY) / r.height); };
    const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); savePrefs(); relayout(); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  applyLayout(); MOBILE_MQ.addEventListener('change', applyLayout);
  showKeyState(); updateHint(); render(); initMap();
})();
</script>
